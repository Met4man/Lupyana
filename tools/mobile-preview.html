<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lupyana Polyclinic — phone preview (390 × 844)</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: #e7eeed;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #0f2a2a;
  }
  h1 { margin: 0 0 4px; font-size: 1.1rem; }
  p.note { margin: 0 0 20px; font-size: 0.85rem; color: #4b6363; }
  .rail {
    display: flex;
    gap: 24px;
    overflow-x: auto;
    padding-bottom: 24px;
    scroll-snap-type: x proximity;
  }
  figure {
    margin: 0;
    flex: 0 0 auto;
    scroll-snap-align: start;
  }
  figcaption {
    margin-bottom: 8px;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #074643;
  }
  .phone {
    width: 390px;
    height: 844px;
    border: 10px solid #0f2a2a;
    border-radius: 38px;
    background: #fff;
    overflow: hidden;
    box-shadow: 0 18px 40px rgba(9, 54, 52, 0.22);
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
</style>
</head>
<body>
  <h1>Lupyana Polyclinic — phone preview</h1>
  <p class="note">Each frame is 390 × 844 CSS pixels served from the local preview at port 4173. Scroll sideways. Open the real thing on a phone at <strong>http://192.168.1.6:4173</strong>.</p>
  <div class="rail">
    <figure><figcaption>Home</figcaption><div class="phone"><iframe src="http://localhost:4173/index.html?intro=1" title="Home on a phone"></iframe></div></figure>
    <figure><figcaption>About</figcaption><div class="phone"><iframe src="http://localhost:4173/about.html?intro=0" title="About on a phone"></iframe></div></figure>
    <figure><figcaption>Services</figcaption><div class="phone"><iframe src="http://localhost:4173/services.html?intro=0" title="Services on a phone"></iframe></div></figure>
    <figure><figcaption>Appointment</figcaption><div class="phone"><iframe src="http://localhost:4173/appointment.html?intro=0" title="Appointment on a phone"></iframe></div></figure>
    <figure><figcaption>Contact</figcaption><div class="phone"><iframe src="http://localhost:4173/contact.html?intro=0" title="Contact on a phone"></iframe></div></figure>
    <figure><figcaption>Privacy &amp; terms</figcaption><div class="phone"><iframe src="http://localhost:4173/privacy.html?intro=0" title="Privacy on a phone"></iframe></div></figure>
    <figure><figcaption>Thank you</figcaption><div class="phone"><iframe src="http://localhost:4173/thank-you.html?intro=0" title="Thank you on a phone"></iframe></div></figure>
    <figure><figcaption>404</figcaption><div class="phone"><iframe src="http://localhost:4173/404.html?intro=0" title="404 on a phone"></iframe></div></figure>
  </div>
</body>
</html>
